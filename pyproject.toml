[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tmt-attrs-pydantic-examples"
version = "0.1.0"
description = "Side-by-side attrs and pydantic sketches of tmt container behavior"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "attrs>=24",
    "cattrs>=24",
    "click>=8",
    "pydantic>=2",
]

[tool.setuptools]
py-modules = ["runner"]
packages = ["support"]
